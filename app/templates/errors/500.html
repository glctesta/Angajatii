{% extends 'base.html' %}

{% block title %}{{ _('500 Internal Server Error') }}{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <h1 class="display-1 text-danger mb-4"><i class="bi bi-x-octagon"></i> 500</h1>
    <h2 class="mb-4">{{ _('Internal Server Error') }}</h2>
    <p class="lead mb-5">{{ _('Something went wrong on our end. Please try again later.') }}</p>
    <a href="/" class="btn btn-primary btn-lg">
        <i class="bi bi-house me-2"></i>{{ _('Return to Dashboard') }}
    </a>
</div>
{% endblock %}
