{% extends 'base.html' %}

{% block title %}{{ _('403 Forbidden') }}{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <h1 class="display-1 text-danger mb-4"><i class="bi bi-shield-lock"></i> 403</h1>
    <h2 class="mb-4">{{ _('Access Denied') }}</h2>
    <p class="lead mb-5">{{ _('You do not have permission to access this resource.') }}</p>
    <a href="/" class="btn btn-primary btn-lg">
        <i class="bi bi-house me-2"></i>{{ _('Return to Dashboard') }}
    </a>
</div>
{% endblock %}
