{% extends 'base.html' %}

{% block title %}{{ _('404 Not Found') }}{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <h1 class="display-1 text-warning mb-4"><i class="bi bi-exclamation-triangle"></i> 404</h1>
    <h2 class="mb-4">{{ _('Page Not Found') }}</h2>
    <p class="lead mb-5">{{ _('The page you are looking for does not exist or has been moved.') }}</p>
    <a href="/" class="btn btn-primary btn-lg">
        <i class="bi bi-house me-2"></i>{{ _('Return to Dashboard') }}
    </a>
</div>
{% endblock %}
